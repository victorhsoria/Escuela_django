<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar · Vida y Ministerio</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f16;color:#e5e7eb;font-family:Segoe UI,Arial}.card{width:min(390px,calc(100% - 40px));padding:32px;border:1px solid #3730a3;border-radius:24px;background:#111827;box-shadow:0 20px 60px #0008}.brand{display:flex;gap:14px;align-items:center;margin-bottom:24px}.logo{width:52px;height:52px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,#6366f1,#8b5cf6);font-weight:900}h1{font-size:21px;margin:0}p{color:#94a3b8;margin:5px 0 0;font-size:13px}label{display:block;margin:14px 0 6px;color:#94a3b8;font-size:12px;font-weight:700;text-transform:uppercase}input{box-sizing:border-box;width:100%;padding:11px 12px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white}button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;font-weight:800;cursor:pointer}.error{margin-top:14px;color:#fecaca;background:#7f1d1d55;border:1px solid #ef444466;border-radius:10px;padding:10px}</style></head><body>
<form class="card" method="post">{% csrf_token %}<div class="brand"><div class="logo">VYM</div><div><h1>Programa Vida y Ministerio</h1><p>Gestión local con Django</p></div></div>
<label>Usuario</label><input name="username" autocomplete="username" value="admin" required><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required><button>Ingresar</button>{% if error %}<div class="error">{{ error }}</div>{% endif %}</form></body></html>
